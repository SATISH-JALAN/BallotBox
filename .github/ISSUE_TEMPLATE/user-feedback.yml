name: User feedback
description: Tried BallotBox on Preprod? Tell us what worked and what did not.
title: "[Feedback] "
labels: ["feedback", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing BallotBox! Every answer here is read and triaged — see
        [docs/FEEDBACK.md](https://github.com/SATISH-JALAN/BallotBox/blob/main/docs/FEEDBACK.md)
        for how feedback turns into changes.

        **Never paste a wallet seed or a key backup file here.**
  - type: dropdown
    id: role
    attributes:
      label: What did you do?
      multiple: true
      options:
        - Joined a poll and voted
        - Checked in as a tester
        - Created / organized a poll
        - Acted as a decryption trustee
        - Used the CLI
        - Only browsed
    validations:
      required: true
  - type: dropdown
    id: completed
    attributes:
      label: Did you manage to cast a vote?
      options:
        - "Yes"
        - "No — I got stuck"
        - "I did not try"
    validations:
      required: true
  - type: dropdown
    id: stuck
    attributes:
      label: If you got stuck, where?
      options:
        - Not applicable
        - Installing / setting up the wallet
        - Getting tNIGHT or DUST
        - Proof server
        - Connecting the wallet to the app
        - Joining (enrolling in) the poll
        - Casting the vote
        - Understanding what was happening
        - Somewhere else
  - type: dropdown
    id: ease
    attributes:
      label: How easy was it overall? (1 = very hard, 5 = very easy)
      options: ["1", "2", "3", "4", "5"]
    validations:
      required: true
  - type: dropdown
    id: trust
    attributes:
      label: Did you understand why your vote stays private?
      options:
        - "Yes, clearly"
        - "Somewhat"
        - "No"
  - type: textarea
    id: best
    attributes:
      label: What worked well?
  - type: textarea
    id: improve
    attributes:
      label: What should we change first?
    validations:
      required: true
  - type: input
    id: wallet
    attributes:
      label: Wallet and browser (optional)
      placeholder: "e.g. Lace 2.x on Chrome 140, or 1AM on Brave"
  - type: input
    id: address
    attributes:
      label: Your Preprod wallet address (optional)
      description: Only if you want to be listed as a verified tester. This is public.
      placeholder: mn_addr_preprod1…
