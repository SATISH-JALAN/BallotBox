name: Deploy

# Continuous delivery for the web app on Vercel.
#
#   pull_request  -> preview deployment (URL in the job summary)
#   push to main  -> production deployment
#
# The app is built here rather than on Vercel because the build needs the Compact compiler
# (Linux/macOS only) to produce the circuit keys the browser proves with. The prebuilt
# output is uploaded with `vercel deploy --prebuilt`.
#
# Setup (once) — see docs/DEPLOYMENT.md:
#   Secrets:   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
#   Variables: VITE_CONTRACT_ADDRESS, VITE_X_URL, VITE_FEEDBACK_URL (optional, baked into the build)
# Until the secrets exist the job logs a warning and skips instead of failing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPACT_VERSION: "0.31.0"
  NODE_VERSION: "24"
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
  PROD_FLAG: ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}

jobs:
  vercel:
    runs-on: ubuntu-latest
    # Fork PRs do not receive secrets; skip rather than fail them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      - name: Check Vercel secrets
        id: gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Vercel secrets not configured — skipping deploy. See docs/DEPLOYMENT.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        if: steps.gate.outputs.ready == 'true'

      - name: Setup Compact compiler
        if: steps.gate.outputs.ready == 'true'
        uses: midnightntwrk/setup-compact-action@836895c8fffbbea6bd986af2b17e8941ff29d1f8
        with:
          compact-version: ${{ env.COMPACT_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.gate.outputs.ready == 'true'
        run: |
          npm install -g npm@11 vercel@latest
          npm ci --legacy-peer-deps

      - name: Compile contract
        if: steps.gate.outputs.ready == 'true'
        working-directory: contract
        run: |
          compact compile src/private-polling.compact src/managed/private-polling
          npm run build

      # Repository variables override the committed .env.preprod values when set.
      - name: Build
        if: steps.gate.outputs.ready == 'true'
        working-directory: private-polling-ui
        env:
          VITE_CONTRACT_ADDRESS: ${{ vars.VITE_CONTRACT_ADDRESS }}
          VITE_X_URL: ${{ vars.VITE_X_URL }}
          VITE_FEEDBACK_URL: ${{ vars.VITE_FEEDBACK_URL }}
          VITE_EXPLORER_TX_URL: ${{ vars.VITE_EXPLORER_TX_URL }}
        run: |
          # Empty variables must not blank out committed defaults, so only export set ones.
          for name in VITE_CONTRACT_ADDRESS VITE_X_URL VITE_FEEDBACK_URL VITE_EXPLORER_TX_URL; do
            [ -z "${!name}" ] && unset "$name"
          done
          npm run build
          npm run vercel:output

      - name: Deploy
        if: steps.gate.outputs.ready == 'true'
        working-directory: private-polling-ui
        run: |
          url=$(vercel deploy --prebuilt $PROD_FLAG --token="${{ secrets.VERCEL_TOKEN }}")
          echo "Deployed to $url"
          echo "### 🚀 Deployed ($VERCEL_ENV): $url" >> "$GITHUB_STEP_SUMMARY"
